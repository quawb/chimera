<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chimera Builder</title>
<style>
  body { font-family: sans-serif; padding: 1rem; background: #f5f5f5; }
  h1 { margin-bottom: 1rem; }
  .dice { margin-bottom: 1rem; }
  .warband { margin-top: 1rem; }
  .model-card { border: 1px solid #333; padding: 0.5rem; margin-bottom: 0.5rem; background: #fff; }
  label { display: block; margin-top: 0.5rem; }
  select, input { margin-top: 0.25rem; }
  .abilities { margin-top: 1rem; }
  .abilities input { margin-right: 0.5rem; }
  .stats { margin-top: 1rem; }
  .stat { margin-bottom: 0.5rem; }
</style>
</head>
<body>

<h1>Chimera Builder</h1>

<div class="dice">
  <button id="rollDice">Roll d6</button>
  <span id="diceResult">Result: -</span>
</div>

<div class="warband">
  <label>Warband Name: <input type="text" id="warbandName" /></label>

  <div id="models">
    <!-- Model cards -->
  </div>

  <div class="abilities">
    <h3>Abilities (Select up to 2)</h3>
    <div id="abilitiesList"></div>
  </div>

  <button id="exportBtn">Export Warband</button>
  <button id="importBtn">Import Warband</button>
  <input type="file" id="importFile" style="display:none" />
</div>

<script>
const statsData = {
  "stats": [
    {"stat":"Move","tiers":[{"tier":1,"value":"5\"","points":0},{"tier":2,"value":"10\"","points":2},{"tier":3,"value":"15\"","points":4}]},
    {"stat":"Defense","tiers":[{"tier":1,"value":-2,"points":0},{"tier":2,"value":-1,"points":4},{"tier":3,"value":0,"points":7}]},
    {"stat":"Shoot","tiers":[{"tier":1,"value":-2,"points":0},{"tier":2,"value":-1,"points":4},{"tier":3,"value":0,"points":7}]},
    {"stat":"Fight","tiers":[{"tier":1,"value":-2,"points":0},{"tier":2,"value":-1,"points":4},{"tier":3,"value":0,"points":7}]}
  ],
  "melee_weapons":[
    {"name":"Unarmed","attacks":1,"damage":1,"effect":"","points":1},
    {"name":"Spiked Bat","attacks":1,"damage":2,"effect":"Down","points":2},
    {"name":"Pocket Knife","attacks":2,"damage":1,"effect":"","points":2},
    {"name":"Sledgehammer","attacks":1,"damage":3,"effect":"Horror","points":3},
    {"name":"Brass Knuckles","attacks":3,"damage":1,"effect":"","points":3},
    {"name":"Axe","attacks":2,"damage":2,"effect":"Down","points":4},
    {"name":"Katana","attacks":4,"damage":1,"effect":"","points":5},
    {"name":"Chainsaw","attacks":1,"damage":4,"effect":"Down + Horror","points":5},
    {"name":"Poisoned Dagger","attacks":2,"damage":1,"effect":"Adds Horror","points":3}
  ],
  "ranged_weapons":[
    {"name":"Blow Dart","attacks":1,"damage":1,"effect":"","points":2},
    {"name":"Slingshot","attacks":2,"damage":1,"effect":"","points":3},
    {"name":"Pistol","attacks":3,"damage":1,"effect":"","points":4},
    {"name":"Shotgun","attacks":1,"damage":3,"effect":"Horror","points":5},
    {"name":"Bow","attacks":1,"damage":2,"effect":"Down","points":3},
    {"name":"Sniper","attacks":1,"damage":4,"effect":"Down + Horror","points":5},
    {"name":"Rifle","attacks":4,"damage":1,"effect":"","points":7},
    {"name":"Auto Crossbow","attacks":2,"damage":2,"effect":"Down","points":5},
    {"name":"Lightning Gun","attacks":1,"damage":1,"effect":"Chains to models 5” away, adds Horror","points":4}
  ],
  "abilities":[
    {"name":"Berserker","effect":"Free 5” move at end of Move phase. If ending in base-to-base with enemy, +1 to fight and 1+ successful damage causes one Horror on defender for this Phase"},
    {"name":"Relentless","effect":"Free 5” move or disengage action after Attack Phase."},
    {"name":"Reckless","effect":"Reroll failed attacks, gain one Horror after the phase ends"},
    {"name":"Undead","effect":"Whenever this model reaches 0 wounds, leave it on the board down, next round the model gains 1 wound and 1 horror, it can no longer recover or disengage for the rest of the game."},
    {"name":"Masochist","effect":"Reroll failed Defense roll. If reroll fails, gain 1 Horror."},
    {"name":"Rupture","effect":"Critical Hits will cause 1 total Horror on Defender"},
    {"name":"Neural Chain","effect":"Use your attack phase to immediately activate (even if exhausted) a friendly model within 5”. At the end of activation that model gains 1 Horror."},
    {"name":"Marked","effect":"Instead of shooting, mark a target that all friendly units within 10” will get +1 Shoot against. When allies hit it, it gains 1 additional Horror (once per phase)."},
    {"name":"Stitcher","effect":"Heal instead of Attack Phase. Heal one model up to 5” away d3 Wounds. If the healed unit is down, stand it up. If they have horror, recover one horror. Gain one horror to perform a second heal."},
    {"name":"Fade","effect":"If in cover, when this unit is shot at, roll defense twice and pick the higher roll."},
    {"name":"Phase","effect":"Once per round, teleport up to 10” away in LoS, can be after getting targeted."},
    {"name":"First Blood","effect":"Once per round, when an attack action is declared against them, they can take an attack action first"},
    {"name":"Quick Draw","effect":"Once per round when an enemy makes a move in their LoS they can make a free shoot action against them. Give the defender the benefit of cover if they don’t already have."}
  ]
};

// Initialize 5 model cards
const modelsDiv = document.getElementById('models');
const modelCards = [];
for (let i=1;i<=5;i++){
  const div = document.createElement('div');
  div.className='model-card';
  div.innerHTML = `<strong>Model ${i}</strong>`;
  statsData.stats.forEach(stat=>{
    const statDiv = document.createElement('div');
    statDiv.className='stat';
    statDiv.innerHTML=`${stat.stat}: 
      <select data-stat="${stat.stat}">
        ${stat.tiers.map(t=>`<option value="${t.value}">${t.value} (${t.points} pts)</option>`).join('')}
      </select>`;
    div.appendChild(statDiv);
  });
  // Calculate wounds based on Defense tier
  const woundsDiv = document.createElement('div');
  woundsDiv.className='stat';
  woundsDiv.innerHTML='Wounds: <span class="wounds">0</span>';
  div.appendChild(woundsDiv);
  modelsDiv.appendChild(div);
  modelCards.push(div);
}

// Update wounds dynamically
modelCards.forEach(card=>{
  const defenseSelect = card.querySelector('select[data-stat="Defense"]');
  const woundsSpan = card.querySelector('.wounds');
  defenseSelect.addEventListener('change', ()=>{
    const tier = statsData.stats.find(s=>s.stat==="Defense").tiers.find(t=>t.value==defenseSelect.value);
    woundsSpan.textContent=4 + parseInt(tier.tier);
  });
  // Set initial wounds
  woundsSpan.textContent=4 + parseInt(statsData.stats.find(s=>s.stat==="Defense").tiers[0].tier);
});

// Initialize Abilities select (max 2)
const abilitiesDiv = document.getElementById('abilitiesList');
statsData.abilities.forEach((ab,i)=>{
  const div = document.createElement('div');
  div.innerHTML = `<input type="checkbox" id="ab${i}" data-index="${i}" /> <strong>${ab.name}</strong>: ${ab.effect}`;
  abilitiesDiv.appendChild(div);
});
abilitiesDiv.addEventListener('change', (e)=>{
  const checked = abilitiesDiv.querySelectorAll('input:checked');
  if(checked.length>2) e.target.checked=false;
});

// Dice roller
document.getElementById('rollDice').addEventListener('click', ()=>{
  document.getElementById('diceResult').textContent = 'Result: '+(Math.floor(Math.random()*6)+1);
});

// Export / Import
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const warband = {
    name: document.getElementById('warbandName').value,
    models: modelCards.map(card=>{
      const m = {};
      statsData.stats.forEach(stat=>{
        m[stat.stat] = card.querySelector(`select[data-stat="${stat.stat}"]`).value;
      });
      return m;
    }),
    abilities: Array.from(abilitiesDiv.querySelectorAll('input:checked')).map(c=>statsData.abilities[c.dataset.index].name)
  };
  const blob = new Blob([JSON.stringify(warband,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='warband.json'; a.click();
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ()=>{
    const data = JSON.parse(reader.result);
    document.getElementById('warbandName').value=data.name||'';
    data.models.forEach((m,i)=>{
      const card=modelCards[i];
      if(!card) return;
      statsData.stats.forEach(stat=>{
        const sel=card.querySelector(`select[data-stat="${stat.stat}"]`);
        if(sel && m[stat.stat]) sel.value=m[stat.stat];
      });
    });
    // Set abilities
    abilitiesDiv.querySelectorAll('input').forEach(inp=>inp.checked=false);
    if(data.abilities){
      data.abilities.forEach(name=>{
        const idx = statsData.abilities.findIndex(a=>a.name===name);
        if(idx>=0) abilitiesDiv.querySelector(`#ab${idx}`).checked=true;
      });
    }
  };
  reader.readAsText(file);
});
</script>

</body>
</html>
