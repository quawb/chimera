<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chimera Warband Builder</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0; padding: 0; background: #f8f8f8; color: #222;
}
header { background: #222; color: #f8f8f8; padding: 1rem; text-align: center; }
header h1 { margin:0; }
main { max-width: 1000px; margin:auto; padding:1rem; }
section { margin-bottom:2rem; }
h2 { background:#444; color:#fff; padding:0.5rem; cursor:pointer; margin:0; }
.content { padding:0.5rem 1rem; background:#fff; border:1px solid #ccc; display:block; }
label { display:block; margin-top:0.5rem; }
select { margin-top:0.2rem; width:100%; padding:0.2rem; }
button { margin-top:0.5rem; padding:0.5rem 1rem; cursor:pointer; }
.table-container { overflow-x:auto; margin-top:1rem; }
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #ccc; padding:0.4rem 0.8rem; text-align:left; }
th { background:#eee; }
.effect { font-style:italic; color:#555; }
.warning { color:red; font-weight:bold; }
</style>
</head>
<body>

<header>
<h1>Chimera Warband Builder</h1>
<p>Build a warband: 3–5 models, 15 points per model, 2 free abilities each</p>
</header>

<main>
<section>
<h2>Warband Controls</h2>
<div class="content">
<button onclick="addModel()">Add Model</button>
<button onclick="removeModel()">Remove Last Model</button>
<p id="warband-warning" class="warning"></p>
<p>Total Warband Points: <span id="total-points">0</span> / 75</p>
</div>
</section>

<section>
<h2>Models</h2>
<div class="content" id="models-container"></div>
</section>

<section>
<h2>Warband Summary</h2>
<div class="content table-container">
<table id="summary-table">
<thead>
<tr><th>Model</th><th>Move</th><th>Defense</th><th>Shoot</th><th>Fight</th><th>Melee</th><th>Ranged</th><th>Abilities</th><th>Points</th></tr>
</thead>
<tbody></tbody>
</table>
</div>
</section>

<script>
// Data
const data = {
  stats:[
    {stat:"Move", tiers:[{tier:1,value:"5\"",points:0},{tier:2,value:"10\"",points:2},{tier:3,value:"15\"",points:4}]},
    {stat:"Defense", tiers:[{tier:1,value:-2,points:0},{tier:2,value:-1,points:4},{tier:3,value:0,points:7}]},
    {stat:"Shoot", tiers:[{tier:1,value:-2,points:0},{tier:2,value:-1,points:4},{tier:3,value:0,points:7}]},
    {stat:"Fight", tiers:[{tier:1,value:-2,points:0},{tier:2,value:-1,points:4},{tier:3,value:0,points:7}]}
  ],
  melee_weapons:[
    {name:"Unarmed",attacks:1,damage:1,effect:"",points:1},
    {name:"Spiked Bat",attacks:1,damage:2,effect:"Down",points:2},
    {name:"Pocket Knife",attacks:2,damage:1,effect:"",points:2},
    {name:"Sledgehammer",attacks:1,damage:3,effect:"Horror",points:3},
    {name:"Brass Knuckles",attacks:3,damage:1,effect:"",points:3},
    {name:"Axe",attacks:2,damage:2,effect:"Down",points:4},
    {name:"Katana",attacks:4,damage:1,effect:"",points:5},
    {name:"Chainsaw",attacks:1,damage:4,effect:"Down + Horror",points:5},
    {name:"Poisoned Dagger",attacks:2,damage:1,effect:"Adds Horror",points:3}
  ],
  ranged_weapons:[
    {name:"Blow Dart",attacks:1,damage:1,effect:"",points:2},
    {name:"Slingshot",attacks:2,damage:1,effect:"",points:3},
    {name:"Pistol",attacks:3,damage:1,effect:"",points:4},
    {name:"Shotgun",attacks:1,damage:3,effect:"Horror",points:5},
    {name:"Bow",attacks:1,damage:2,effect:"Down",points:3},
    {name:"Sniper",attacks:1,damage:4,effect:"Down + Horror",points:5},
    {name:"Rifle",attacks:4,damage:1,effect:"",points:7},
    {name:"Auto Crossbow",attacks:2,damage:2,effect:"Down",points:5},
    {name:"Lightning Gun",attacks:1,damage:1,effect:"Chains to models 5” away, adds Horror",points:4}
  ],
  abilities:[
    {name:"Berserker",effect:"Free 5” move at end of Move phase. If ending in base-to-base with enemy, +1 to fight and 1+ successful damage causes one Horror on defender for this Phase"},
    {name:"Relentless",effect:"Free 5” move or disengage action after Attack Phase."},
    {name:"Reckless",effect:"Reroll failed attacks, gain one Horror after the phase ends"},
    {name:"Undead",effect:"Whenever this model reaches 0 wounds, leave it on the board down, next round the model gains 1 wound and 1 horror, it can no longer recover or disengage for the rest of the game."},
    {name:"Masochist",effect:"Reroll failed Defense roll. If reroll fails, gain 1 Horror."},
    {name:"Rupture",effect:"Critical Hits will cause 1 total Horror on Defender"},
    {name:"Neural Chain",effect:"Use your attack phase to immediately activate (even if exhausted) a friendly model within 5”. At the end of activation that model gains 1 Horror."},
    {name:"Marked",effect:"Instead of shooting, mark a target that all friendly units within 10” will get +1 Shoot against. When allies hit it, it gains 1 additional Horror (once per phase)."},
    {name:"Stitcher",effect:"Heal instead of Attack Phase. Heal one model up to 5” away d3 Wounds. If the healed unit is down, stand it up. If they have horror, recover one horror. Gain one horror to perform a second heal."},
    {name:"Fade",effect:"If in cover, when this unit is shot at, roll defense twice and pick the higher roll."},
    {name:"Phase",effect:"Once per round, teleport up to 10” away in LoS, can be after getting targeted."},
    {name:"First Blood",effect:"Once per round, when an attack action is declared against them, they can take an attack action first"},
    {name:"Quick Draw",effect:"Once per round when an enemy makes a move in their LoS they can make a free shoot action against them. Give the defender the benefit of cover if they don’t already have."}
  ]
};

// Warband models array
let models = [];

function addModel() {
  if(models.length>=5) return alert("Max 5 models!");
  const id = models.length;
  const model = {id, name:`Model ${id+1}`, Move:1, Defense:1, Shoot:1, Fight:1, Melee:"Unarmed", Ranged:"Blow Dart", Abilities:[]};
  models.push(model);
  renderModels();
  updateSummary();
}
function removeModel() {
  if(models.length===0) return;
  models.pop();
  renderModels();
  updateSummary();
}

function renderModels() {
  const container = document.getElementById('models-container');
  container.innerHTML='';
  models.forEach((m,i)=>{
    const div = document.createElement('div');
    div.style.border='1px solid #ccc'; div.style.padding='0.5rem'; div.style.marginTop='0.5rem';
    div.innerHTML=`
      <h3>${m.name}</h3>
      <label>Move Tier
        <select onchange="updateModel(${i}, 'Move', this.value)">
          ${data.stats.find(s=>s.stat==='Move').tiers.map(t=>`<option value="${t.tier}" ${t.tier==m.Move?'selected':''}>Tier ${t.tier} (${t.value})</option>`).join('')}
        </select>
      </label>
      <label>Defense Tier
        <select onchange="updateModel(${i}, 'Defense', this.value)">
          ${data.stats.find(s=>s.stat==='Defense').tiers.map(t=>`<option value="${t.tier}" ${t.tier==m.Defense?'selected':''}>Tier ${t.tier} (${t.value})</option>`).join('')}
        </select>
      </label>
      <label>Shoot Tier
        <select onchange="updateModel(${i}, 'Shoot', this.value)">
          ${data.stats.find(s=>s.stat==='Shoot').tiers.map(t=>`<option value="${t.tier}" ${t.tier==m.Shoot?'selected':''}>Tier ${t.tier} (${t.value})</option>`).join('')}
        </select>
      </label>
      <label>Fight Tier
        <select onchange="updateModel(${i}, 'Fight', this.value)">
          ${data.stats.find(s=>s.stat==='Fight').tiers.map(t=>`<option value="${t.tier}" ${t.tier==m.Fight?'selected':''}>Tier ${t.tier} (${t.value})</option>`).join('')}
        </select>
      </label>
      <label>Melee Weapon
        <select onchange="updateModel(${i}, 'Melee', this.value)">
          ${data.melee_weapons.map(w=>`<option value="${w.name}" ${w.name==m.Melee?'selected':''}>${w.name} (${w.points} pts)</option>`).join('')}
        </select>
      </label>
      <label>Ranged Weapon
        <select onchange="updateModel(${i}, 'Ranged', this.value)">
          ${data.ranged_weapons.map(w=>`<option value="${w.name}" ${w.name==m.Ranged?'selected':''}>${w.name} (${w.points} pts)</option>`).join('')}
        </select>
      </label>
      <label>Abilities (Select up to 2)
        <select multiple size="5" onchange="updateModelAbilities(${i}, this)">
          ${data.abilities.map(a=>`<option value="${a.name}" ${m.Abilities.includes(a.name)?'selected':''}>${a.name}</option>`).join('')}
        </select>
      </label>
    `;
    container.appendChild(div);
  });
}

function updateModel(index, field, value) {
  models[index][field] = parseInt(value);
  updateSummary();
}

function updateModelAbilities(index, select) {
  const selected = Array.from(select.selectedOptions).map(o=>o.value);
  if(selected.length>2) {
    alert("Max 2 abilities per model!");
    renderModels();
    return;
  }
  models[index].Abilities = selected;
  updateSummary();
}

function getPoints(model) {
  const statPoints = ['Move','Defense','Shoot','Fight'].reduce((sum,s)=>{
    const tier = data.stats.find(st=>st.stat===s).tiers.find(t=>t.tier==model[s]);
    return sum + tier.points;
  },0);
  const meleePoints = data.melee_weapons.find(w=>w.name===model.Melee).points;
  const rangedPoints = data.ranged_weapons.find(w=>w.name===model.Ranged).points;
  return 15 + statPoints + meleePoints + rangedPoints; // 15 base + points
}

function updateSummary() {
  const tbody = document.querySelector('#summary-table tbody');
  tbody.innerHTML='';
  let total = 0;
  models.forEach(m=>{
    const tr = document.createElement('tr');
    const points = getPoints(m);
    total += points;
    tr.innerHTML=`<td>${m.name}</td>
      <td>${m.Move}</td><td>${m.Defense}</td><td>${m.Shoot}</td><td>${m.Fight}</td>
      <td>${m.Melee}</td><td>${m.Ranged}</td><td>${m.Abilities.join(', ')}</td><td>${points}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('total-points').textContent = total;
  const warning = document.getElementById('warband-warning');
  if(models.length<3) warning.textContent="You need at least 3 models!";
  else if(models.length>5) warning.textContent="Maximum 5 models!";
  else if(total>75) warning.textContent="Total points exceed 75!";
  else warning.textContent="";
}

</script>

</main>
</body>
</html>
